name: customer-spending-insights

services:
  api:
    build:
      context: ./customer-api
      target: dev
    environment:
      CORS_ORIGINS: http://localhost:3000
      # Pin the reference date to make the generated dataset reproducible, e.g. MOCK_TODAY=2024-09-16
      MOCK_TODAY: ${MOCK_TODAY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./customer-api/src:/app/src
      - ./customer-api/tests:/app/tests
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build:
      context: ./customer-client
      target: dev
    environment:
      # The browser calls the API via the host; the Next server calls it over the compose network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./customer-client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  client_node_modules:
  client_next:
