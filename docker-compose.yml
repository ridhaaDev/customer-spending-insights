name: customer-spending-insights

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-customer_spending}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-customer_spending}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./customer-api
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-customer_spending}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./customer-api/src:/app/src
      - ./customer-api/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./customer-client
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./customer-client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    depends_on:
      - api

volumes:
  pgdata:
  client_node_modules:
  client_next:
