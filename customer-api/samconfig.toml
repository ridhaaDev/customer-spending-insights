version = 0.1

[default.global.parameters]
stack_name = "customer-spending-insights-api"
region = "us-east-1"
profile = "personal"

[default.build.parameters]
use_container = true
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
fail_on_empty_changeset = false
# Override at deploy time, e.g.:
#   sam deploy --parameter-overrides CorsOrigins=https://xxxx.cloudfront.net DatabaseUrl=postgresql+asyncpg://...
parameter_overrides = "CorsOrigins=http://localhost:3000"
