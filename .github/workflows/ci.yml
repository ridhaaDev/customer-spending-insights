name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: customer-api/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('customer-api/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check .
      - name: Format check
        run: poetry run ruff format --check .
      - name: Tests
        run: poetry run pytest -q

  client:
    name: Client (lint, types, tests, builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and accessibility tests
        run: npm test
      - name: Build app
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API production image
        uses: docker/build-push-action@v6
        with:
          context: customer-api
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Client production image
        uses: docker/build-push-action@v6
        with:
          context: customer-client
          target: prod
          push: false
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
